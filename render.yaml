services:
  - type: web
    name: fitpulse-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitpulse-db
          property: connectionString

databases:
  - name: fitpulse-db
    databaseName: pulsefit_db
    user: pulsefit_user
    plan: free
